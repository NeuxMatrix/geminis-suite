name: Compilar Geminis

# Ahorro de minutos (16/11/2026): en GitHub, 1 minuto de Windows cuenta como 2
# y 1 de macOS como 10. Por eso:
# - Windows se compila en cada subida (menos si solo cambian textos .md).
# - macOS solo en main o al lanzarlo a mano con «Incluir macOS».
# - Si subes otra vez a la misma rama, se cancela la compilación anterior.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/desplegar-web.yml'
  workflow_dispatch:
    inputs:
      macos:
        description: 'Incluir macOS (cada minuto cuenta como 10)'
        type: boolean
        default: false

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.ref == 'refs/heads/main' || inputs.macos) && fromJSON('["windows-latest","macos-latest"]') || fromJSON('["windows-latest"]') }}
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SISTEMA: ${{ startsWith(matrix.os, 'windows') && 'Windows' || 'macOS' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGEMINIS_BUILD_TESTS=ON
      - name: Compilar
        run: cmake --build build --config Release --parallel 4
      - name: Prueba de audio (todos los módulos y presets)
        run: |
          mkdir -p prueba-audio
          if [ -f build/GeminisDspTest_artefacts/Release/GeminisDspTest.exe ]; then
            build/GeminisDspTest_artefacts/Release/GeminisDspTest.exe prueba-audio
          else
            build/GeminisDspTest_artefacts/Release/GeminisDspTest prueba-audio
          fi
      - name: Prueba de Geminis Instrument (presets, kits e instrumentos)
        run: |
          if [ -f build/GeminisInstTest_artefacts/Release/GeminisInstTest.exe ]; then
            build/GeminisInstTest_artefacts/Release/GeminisInstTest.exe
          else
            build/GeminisInstTest_artefacts/Release/GeminisInstTest
          fi
      - name: Instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(GeminisSuite VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer\GeminisSuite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar instalador
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Geminis-Instalador-Windows
          if-no-files-found: error
          path: installer/Output/*.exe
      - name: Publicar plugins
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Geminis-${{ env.SISTEMA }}
          if-no-files-found: warn
          path: |
            build/GeminisFX_artefacts/Release/VST3
            build/GeminisFX_artefacts/Release/AU
            build/GeminisFX_artefacts/Release/Standalone
            build/GeminisInstrument_artefacts/Release/VST3
            build/GeminisInstrument_artefacts/Release/AU
            build/GeminisInstrument_artefacts/Release/Standalone
