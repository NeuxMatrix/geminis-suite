name: Compilar Geminis

# Ahorro de minutos (16/11/2026): en GitHub, 1 minuto de Windows cuenta como 2
# y 1 de macOS como 10. Por eso:
# - Windows se compila en cada subida (menos si solo cambian textos .md).
# - macOS solo en main o al lanzarlo a mano con «Incluir macOS».
# - Si subes otra vez a la misma rama, se cancela la compilación anterior.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/desplegar-web.yml'
  workflow_dispatch:
    inputs:
      macos:
        description: 'Incluir macOS (cada minuto cuenta como 10)'
        type: boolean
        default: false

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.ref == 'refs/heads/main' || inputs.macos) && fromJSON('["windows-latest","macos-latest"]') || fromJSON('["windows-latest"]') }}
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SISTEMA: ${{ startsWith(matrix.os, 'windows') && 'Windows' || 'macOS' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGEMINIS_BUILD_TESTS=ON
      - name: Compilar
        run: cmake --build build --config Release --parallel 4
      - name: Prueba de audio (todos los módulos y presets)
        run: |
          mkdir -p prueba-audio
          if [ -f build/GeminisDspTest_artefacts/Release/GeminisDspTest.exe ]; then
            build/GeminisDspTest_artefacts/Release/GeminisDspTest.exe prueba-audio
          else
            build/GeminisDspTest_artefacts/Release/GeminisDspTest prueba-audio
          fi
      - name: Prueba de Geminis Instrument (presets, kits e instrumentos)
        run: |
          if [ -f build/GeminisInstTest_artefacts/Release/GeminisInstTest.exe ]; then
            build/GeminisInstTest_artefacts/Release/GeminisInstTest.exe
          else
            build/GeminisInstTest_artefacts/Release/GeminisInstTest
          fi
      - name: Comprobar que macOS sirve en Intel y Apple Silicon desde 10.13
        if: runner.os == 'macOS'
        run: |
          set -e
          for f in build/GeminisApp_artefacts/Release/Geminis.app/Contents/MacOS/* \
                   build/Geminis*_artefacts/Release/VST3/*.vst3/Contents/MacOS/* \
                   build/Geminis*_artefacts/Release/AU/*.component/Contents/MacOS/*; do
            archs=$(lipo -archs "$f")
            echo "$f: $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "Falta una arquitectura"; exit 1;; esac
            for a in x86_64 arm64; do
              minos=$(otool -arch "$a" -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{v=1} v&&/version/{print $2; exit}')
              echo "  $a: macOS mínimo $minos"
              test "$minos" = "10.13" || test "$minos" = "11.0"
            done
          done
      - name: Instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(GeminisSuite VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer\GeminisSuite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalador de macOS
        if: runner.os == 'macOS'
        run: |
          version=$(sed -nE 's/^project\(GeminisSuite VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          installer/macos/crear-pkg.sh build "$version" "installer/Output/Geminis-Suite-$version-macOS.pkg"
      - name: Publicar instalador de macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Geminis-Instalador-macOS
          if-no-files-found: error
          path: installer/Output/*.pkg
      - name: Publicar instalador
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Geminis-Instalador-Windows
          if-no-files-found: error
          path: installer/Output/*.exe
      - name: Publicar plugins
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: Geminis-${{ env.SISTEMA }}
          if-no-files-found: warn
          path: |
            build/GeminisApp_artefacts/Release/Geminis.exe
            build/GeminisApp_artefacts/Release/Geminis.app
            build/GeminisFX_artefacts/Release/VST3
            build/GeminisFX_artefacts/Release/AU
            build/GeminisInstrument_artefacts/Release/VST3
            build/GeminisInstrument_artefacts/Release/AU
